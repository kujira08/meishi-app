<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152F45">
<title>名刺管理</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="名刺管理">
<meta name="app-version" content="20260829-5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --washi:#F6F1E4; --paper:#FCFAF3;
  --indigo-deep:#152F45; --indigo:#1F3F5C; --indigo-mid:#3C6E8F; --indigo-pale:#E4EDF0;
  --sumi:#26241F; --sumi-soft:#6B6656; --sumi-faint:#A39D89;
  --shu:#B23A2E; --shu-pale:#F6E4DE;
  --border:#DED4BC;
  --radius:14px; --radius-sm:9px;
  --display:"Shippori Mincho",serif;
  --body:"Noto Sans JP",sans-serif;
  --mono:"JetBrains Mono",monospace;
  --col:480px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--washi); color:var(--sumi);
  font-family:var(--body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:var(--col);margin:0 auto;background:var(--washi);min-height:100vh;position:relative}
.view{display:none}
.view.active{display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible,input:focus,textarea:focus{outline:2px solid var(--indigo-mid);outline-offset:1px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:var(--indigo-deep);color:#fff;padding:14px 16px 10px}
.hdr-top{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:25px;flex:0 0 38px;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.hdr-title{font-family:var(--display);font-size:19px;letter-spacing:.06em;margin:0;flex:1}
.hdr-count{font-family:var(--mono);font-size:12px;color:#9FBBCE;letter-spacing:.02em}
.search{
  margin-top:11px;width:100%;padding:10px 12px;
  background:rgba(255,255,255,.94);border:1px solid transparent;border-radius:var(--radius-sm);
  font-size:14px;color:var(--sumi);
}
.search::placeholder{color:var(--sumi-faint)}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;min-height:34px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  color:#DCE7EE;border-radius:999px;font-size:13px;white-space:nowrap;
}
.chip.active{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500}

/* ---------- list ---------- */
.listbar{
  display:flex;align-items:center;gap:10px;padding:12px 16px 0;
}
.listbar #hits{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--sumi-faint)}
.listbar select{
  padding:7px 10px;min-height:36px;font-size:12.5px;color:var(--sumi);
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);
}
.backup-nudge{
  display:flex;align-items:center;gap:9px;margin:12px 16px 0;padding:11px 12px;
  background:var(--shu-pale);border:1px solid var(--shu);border-radius:var(--radius-sm);
  font-size:12.5px;color:var(--shu);line-height:1.6;
}
.backup-nudge span{flex:1}
.backup-nudge button{
  border:none;background:var(--shu);color:#fff;border-radius:var(--radius-sm);
  padding:8px 12px;min-height:36px;font-size:12.5px;font-weight:500;
}
.backup-nudge #nudge-close{background:none;color:var(--shu);font-size:17px;padding:6px 4px;min-width:32px}
.list{padding:14px 16px 96px}
.card-item{
  position:relative;background:var(--paper);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;
  transition:transform .12s ease,background .12s ease;
}
.card-item:active{transform:scale(.99);background:#F5F0E2}
.card-item.followup::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  background:var(--shu);border-radius:0 3px 3px 0;
}
.card-name{font-family:var(--display);font-size:18px;line-height:1.35;margin:0}
.card-title{font-size:12.5px;color:var(--sumi-soft);margin:1px 0 0}
.card-company{font-size:13.5px;color:var(--indigo);font-weight:500;margin:5px 0 0}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--indigo-pale);color:var(--indigo)}
.tag.exhibition{background:var(--shu-pale);color:var(--shu)}
.badge-follow{
  display:inline-block;margin-top:9px;font-size:11.5px;font-weight:500;
  color:var(--shu);background:var(--shu-pale);padding:3px 9px;border-radius:var(--radius-sm);
}
.empty{padding:70px 30px;text-align:center;color:var(--sumi-soft)}
.empty-icon{font-size:38px;display:block;margin-bottom:12px}
.empty p{margin:0;font-size:14px;line-height:1.8}

/* ---------- FAB ---------- */
.fab{
  position:fixed;bottom:22px;z-index:40;
  right:max(16px,calc(50% - (var(--col)/2) + 16px));
  background:var(--indigo-deep);color:#fff;border:none;
  padding:14px 20px;min-height:52px;border-radius:999px;
  font-size:14.5px;font-weight:500;letter-spacing:.03em;
  box-shadow:0 6px 18px rgba(21,47,69,.30);
}
.fab:active{transform:scale(.97)}

/* ---------- sub header ---------- */
.subhdr{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;
  background:var(--indigo-deep);color:#fff;padding:11px 12px;
}
.icon-btn{
  background:none;border:none;color:#fff;font-size:18px;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);
}
.icon-btn:active{background:rgba(255,255,255,.12)}
.subhdr h2{font-family:var(--display);font-size:16.5px;font-weight:700;margin:0;letter-spacing:.05em}

/* ---------- form ---------- */
.form-wrap{padding:16px 18px 110px}
.shot{
  border:2px dashed var(--border);border-radius:var(--radius);
  background:var(--paper);padding:34px 18px;text-align:center;color:var(--sumi-soft);
  display:block;width:100%;
}
.shot:active{background:#F5F0E2}
.shot-icon{font-size:30px;display:block;margin-bottom:8px}
.shot strong{display:block;font-size:15px;color:var(--sumi);font-weight:500;margin-bottom:3px}
.shot span.sub{font-size:12.5px}
.read-now{
  display:block;width:100%;margin-top:10px;padding:14px;min-height:52px;
  background:var(--indigo-deep);border:1px solid var(--indigo-deep);border-radius:var(--radius-sm);
  color:#fff;font-size:15.5px;font-weight:500;letter-spacing:.03em;
}
.read-now:active{transform:scale(.99);opacity:.9}
.add-back{
  display:block;width:100%;margin-top:9px;padding:13px 16px;min-height:48px;
  background:var(--indigo-pale);border:1px solid var(--indigo-mid);border-radius:var(--radius-sm);
  color:var(--indigo-deep);font-size:14px;font-weight:500;
}
.add-back small{display:block;font-size:11.5px;font-weight:400;color:var(--indigo);margin-top:2px}
.add-back:active{opacity:.85}
.sides-note{
  margin:8px 0 0;font-size:12px;color:var(--sumi-soft);text-align:center;
}
.qr-note{
  margin-top:10px;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--indigo-pale);border:1px solid var(--indigo-mid);
  color:var(--indigo-deep);font-size:13px;line-height:1.7;
}
.qr-note b{font-weight:700}
.manual-link{
  display:block;width:100%;margin-top:12px;padding:12px;min-height:44px;
  background:none;border:none;color:var(--indigo);font-size:13.5px;
  text-decoration:underline;text-underline-offset:3px;
}
.preview{width:100%;border-radius:var(--radius);border:1px solid var(--border);display:block}
.retake{
  display:block;width:100%;margin-top:8px;padding:10px;min-height:44px;
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--sumi-soft);
}
.ocr-bar{
  display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;
  background:var(--indigo-pale);border-radius:var(--radius-sm);font-size:13.5px;color:var(--indigo);
}
.ocr-bar.error{background:var(--shu-pale);color:var(--shu)}
.spinner{
  width:17px;height:17px;flex:0 0 17px;border-radius:50%;
  border:2px solid rgba(60,110,143,.30);border-top-color:var(--indigo-mid);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-pct{margin-left:auto;font-family:var(--mono);font-size:12.5px;white-space:nowrap}

.sec{margin-top:22px}
.sec-title{
  font-family:var(--display);font-size:14px;color:var(--indigo-deep);
  letter-spacing:.08em;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12.5px;color:var(--sumi-soft);margin-bottom:5px;letter-spacing:.04em}
.fg input,.fg textarea{
  width:100%;padding:11px 12px;min-height:44px;
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);
}
.fg textarea{min-height:92px;resize:vertical;line-height:1.7}
.fg input::placeholder,.fg textarea::placeholder{color:var(--sumi-faint)}
.fg input.invalid{border-color:var(--shu);background:var(--shu-pale)}
.fg .hint{font-size:11.5px;color:var(--sumi-faint);margin-top:5px}
.fg .hint.err{color:var(--shu)}

.toggle-row{
  display:flex;align-items:center;gap:12px;padding:12px 13px;min-height:44px;
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);
}
.toggle-row .lbl{flex:1;font-size:14px}
.toggle-sw{
  width:48px;height:28px;flex:0 0 48px;border-radius:999px;border:none;
  background:#CFC9B6;position:relative;transition:background .15s ease;padding:0;
}
.toggle-sw::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle-sw.on{background:var(--shu)}
.toggle-sw.on::after{transform:translateX(20px)}

.bottombar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(var(--col),100%);z-index:40;
  display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(246,241,228,.96);border-top:1px solid var(--border);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.btn,.btn-primary,.btn-danger{
  flex:1;padding:13px 16px;min-height:48px;border-radius:var(--radius-sm);
  font-size:15px;font-weight:500;letter-spacing:.03em;border:1px solid var(--border);
  background:var(--paper);color:var(--sumi);
}
.btn-primary{background:var(--indigo-deep);border-color:var(--indigo-deep);color:#fff}
.btn-danger{flex:0 0 auto;background:none;border-color:transparent;color:var(--shu)}
.btn:active,.btn-primary:active,.btn-danger:active{transform:scale(.99);opacity:.9}

/* ---------- detail ---------- */
.hero{background:var(--indigo-deep);color:#fff;padding:22px 20px 26px}
.hero .kana{font-size:12px;color:#8FAEC3;margin:0 0 3px;letter-spacing:.08em}
.hero .nm{font-family:var(--display);font-size:26px;line-height:1.3;margin:0}
.hero .ttl{font-size:13px;color:#A9C3D4;margin:6px 0 0}
.hero .cmp{font-size:15px;margin:10px 0 0;font-weight:500}
.card-photo{
  width:100%;display:block;margin:0 0 6px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--paper);
}
.photo-zoom{
  position:fixed;inset:0;z-index:70;background:rgba(21,47,69,.92);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.photo-zoom img{max-width:100%;max-height:100%;border-radius:8px}
.detail-wrap{padding:16px 18px 110px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.row-ico{flex:0 0 22px;color:var(--indigo-mid);font-size:15px;text-align:center;line-height:1.6}
.row-body{flex:1;min-width:0}
.row-label{font-size:11.5px;color:var(--sumi-faint);letter-spacing:.06em}
.row-val{font-size:15px;margin-top:1px}
.row-val.addr{word-break:break-all}
.row-val a{color:var(--indigo);text-decoration:none;border-bottom:1px solid var(--indigo-pale)}
.mail-btn{
  display:block;width:100%;margin-top:16px;padding:14px;min-height:50px;
  background:var(--paper);border:1px solid var(--indigo-mid);border-radius:var(--radius-sm);
  color:var(--indigo-deep);font-size:14.5px;font-weight:500;
}
.mail-btn:active{background:var(--indigo-pale)}
.block{margin-top:18px;padding:14px 15px;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius)}
.block h3{font-family:var(--display);font-size:13.5px;letter-spacing:.08em;color:var(--indigo-deep);margin:0 0 8px}
.block p{margin:0;font-size:14px;line-height:1.85;white-space:pre-wrap}
.fu-block{margin-top:18px;padding:14px 15px;border-radius:var(--radius);border:1px solid var(--shu);background:var(--shu-pale)}
.fu-block .st{font-size:13.5px;font-weight:700;color:var(--shu);margin:0}
.fu-block .dt{font-family:var(--mono);font-size:12.5px;color:var(--sumi-soft);margin:5px 0 0}
.fu-block.done{border-color:var(--indigo-mid);background:var(--indigo-pale)}
.fu-block.done .st{color:var(--indigo)}
.sns-pick{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.sns-pick a{
  font-size:11px;padding:3px 9px;border-radius:999px;text-decoration:none;
  background:var(--indigo-pale);color:var(--indigo);border:1px solid var(--indigo-mid);
}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}

/* ---------- sheet ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom));z-index:55;
  width:min(calc(var(--col) - 32px),calc(100% - 32px));
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:var(--radius);
  background:var(--indigo-deep);color:#fff;font-size:13.5px;
  box-shadow:0 8px 22px rgba(21,47,69,.32);
}
.toast span{flex:1}
.toast button{
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
  color:#fff;border-radius:999px;padding:8px 14px;min-height:38px;font-size:13px;font-weight:500;
}
.toast button:active{background:rgba(255,255,255,.24)}
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(21,47,69,.42);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  width:min(var(--col),100%);background:var(--washi);
  border-radius:var(--radius) var(--radius) 0 0;border-top:1px solid var(--border);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet h3{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--indigo-deep);margin:0 0 4px}
.sheet .note{font-size:12px;color:var(--sumi-soft);margin:0 0 14px;line-height:1.7}
.sheet .note b{font-family:var(--mono);font-weight:500;color:var(--sumi)}
.sheet-item{
  display:block;width:100%;text-align:left;margin-bottom:9px;
  padding:13px 14px;min-height:48px;
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:14.5px;
}
.sheet-item small{display:block;font-size:11.5px;color:var(--sumi-soft);margin-top:2px}
.sheet-item:active{background:#F5F0E2}
</style>
</head>
<body>
<div class="app">

<!-- ============ 一覧 ============ -->
<section id="view-list" class="view active">
  <header class="hdr">
    <div class="hdr-top">
      <svg class="logo" viewBox="0 0 64 42" aria-hidden="true">
        <rect x="1" y="1" width="62" height="40" rx="6" fill="#FCFAF3"/>
        <rect x="9" y="12" width="30" height="4" rx="2" fill="#96A8B6"/>
        <rect x="9" y="21" width="22" height="3" rx="1.5" fill="#96A8B6"/>
        <rect x="9" y="28" width="15" height="3" rx="1.5" fill="#96A8B6"/>
        <circle cx="50" cy="28" r="7" fill="#B23A2E"/>
      </svg>
      <h1 class="hdr-title">名刺管理</h1>
      <span class="hdr-count" id="count">0 件</span>
      <button class="icon-btn" id="btn-sheet" aria-label="データの管理" style="width:36px;height:36px;font-size:17px">⋯</button>
    </div>
    <input class="search" id="search" type="search" placeholder="名前・ふりがな・会社・タグで検索" autocomplete="off">
    <div class="chips" id="chips"></div>
  </header>
  <div class="listbar">
    <span id="hits"></span>
    <select id="sort" aria-label="並べ替え">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="name">氏名順</option>
      <option value="company">会社名順</option>
    </select>
  </div>
  <div class="backup-nudge" id="nudge" hidden>
    <span id="nudge-msg"></span>
    <button id="nudge-go">書き出す</button>
    <button id="nudge-close" aria-label="閉じる">×</button>
  </div>
  <div class="list" id="list"></div>
  <button class="fab" id="fab">＋ 名刺を撮影</button>
</section>

<!-- ============ 撮影・登録 ============ -->
<section id="view-form" class="view">
  <header class="subhdr">
    <button class="icon-btn" id="form-back" aria-label="戻る">←</button>
    <h2 id="form-title">名刺を登録</h2>
  </header>
  <div class="form-wrap">
    <div id="shot-area">
      <button class="shot" id="shot-box" type="button">
        <span class="shot-icon" aria-hidden="true">📷</span>
        <strong>名刺を撮影する</strong>
        <span class="sub">カメラが開かなければタップしてください</span>
      </button>
      <button class="manual-link" id="manual-btn" type="button">写真なしで手入力する</button>
    </div>
    <div id="preview-area" hidden>
      <img class="preview" id="preview" alt="撮影した名刺">
      <button class="retake" id="retake" type="button">撮り直す</button>
      <div id="side-choice" hidden>
        <button class="read-now" id="go-read" type="button">この1枚で読み取る</button>
        <button class="add-back" id="add-back" type="button">📄 裏面も撮る
          <small>2枚まとめて読むので、別々に撮るより安く正確です</small></button>
      </div>
      <p class="sides-note" id="sides-note" hidden></p>
    </div>
    <button class="retake" id="attach-photo" type="button" hidden>📷 名刺の写真も残す</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <div class="ocr-bar" id="ocr-bar" hidden>
      <span class="spinner" id="ocr-spin"></span>
      <span id="ocr-msg">読み取っています…</span>
      <span class="ocr-pct" id="ocr-pct"></span>
    </div>

    <div class="qr-note" id="qr-note" hidden></div>
    <div id="fields" hidden>
      <div class="sec">
        <h3 class="sec-title">基本情報</h3>
        <div class="fg">
          <label for="f-name">氏名 <span style="color:var(--shu)">*</span></label>
          <input id="f-name" type="text" placeholder="大川原 誠人">
          <p class="hint err" id="name-hint" hidden>氏名を入力してください。</p>
        </div>
        <div class="fg"><label for="f-kana">ふりがな</label><input id="f-kana" type="text" placeholder="おおかわら まさと"><p class="hint">かなでも検索できるようになります</p></div>
        <div class="fg"><label for="f-company">会社名</label><input id="f-company" type="text" placeholder="株式会社〇〇"></div>
        <div class="fg"><label for="f-title">部署・役職</label><input id="f-title" type="text" placeholder="営業部 課長"></div>
        <div class="fg"><label for="f-tel">電話</label><input id="f-tel" type="tel" placeholder="087-000-0000"></div>

<div class="sheet-bg" id="sheet-bg" hidden>
  <div class="sheet" role="dialog" aria-label="データの管理">
    <h3>データの管理</h3>
    <p class="note">この名刺データは<b>この端末のブラウザの中だけ</b>に保存されています。<br>
      履歴の削除や機種変更で消えるので、ときどき書き出してください。<br>
      現在 <b id="sheet-count">0</b> 件 ／ <b id="sheet-size">0</b> KB ／ 版 <b id="sheet-ver"></b></p>
    <button class="sheet-item" id="btn-export">バックアップを書き出す<small>JSONファイルとして保存します</small></button>

  </div>

</div>
<script>
/* ============================================================
   データ層（将来 GAS API に差し替えるのはここだけ）
   ============================================================ */
const KEY = 'meishi_cards_v1';
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } },
  persist(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
};
let cards = store.load();
let filter = 'all';
let keyword = '';
let sortBy = 'new';
let editingId = null;
let currentId = null;

function persistSafe(){
  try { store.persist(cards); return true; }
  catch(e){
    // 容量オーバー：古い順に画像を捨てて再挑戦
    const withImg = cards.filter(c => c.image);
    for (let i = withImg.length - 1; i >= 0; i--){
      delete withImg[i].image;
      try { store.persist(cards); 
        alert('保存容量がいっぱいのため、古い名刺の画像を削除しました。\n文字のデータは残っています。バックアップの書き出しをおすすめします。');
        return true;
      } catch(e2){ /* 続けて捨てる */ }
    }
    alert('保存できませんでした。保存容量がいっぱいです。\n不要な名刺を削除するか、バックアップを書き出してください。');
    return false;
  }
}
function saveCard(data){
  if (data.id){
    const i = cards.findIndex(c => c.id === data.id);
    if (i >= 0) cards[i] = Object.assign({}, cards[i], data);
  } else {
    data.id = 'c' + Date.now() + Math.random().toString(36).slice(2,6);
    data.createdAt = new Date().toISOString();
    cards.unshift(data);
  }
  persistSafe();
  return data.id;
}
// 氏名一致、またはメール一致を重複とみなす
function findDuplicate(d){
  const n = norm(d.name), em = (d.email || '').toLowerCase();
  return cards.find(c => {
    if (c.id === d.id) return false;
    if (em && (c.email || '').toLowerCase() === em) return true;
    if (n && norm(c.name) === n){
      // 同姓同名の別人を弾くため、会社名が両方あって違うときは別人扱い
      if (d.company && c.company && norm(c.company) !== norm(d.company)) return false;
      return true;
    }
    return false;
  }) || null;
}
function deleteCard(id){ cards = cards.filter(c => c.id !== id); persistSafe(); }
function getCard(id){ return cards.find(c => c.id === id); }

/* ============================================================
   画面切り替え（ブラウザバック対応）
   ============================================================ */
const $ = s => document.querySelector(s);
function setView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + name).classList.add('active');
  window.scrollTo(0,0);
}
function go(state){                       // 進む（履歴を積む）
  history.pushState(state, '');
  render(state);
}
function render(state){                   // 履歴の状態を画面に反映
  if (!state || state.v === 'list'){ renderList(); setView('list'); return; }
  if (state.v === 'detail'){ if (!getCard(state.id)) { renderList(); setView('list'); return; } paintDetail(state.id); setView('detail'); return; }
  if (state.v === 'form'){ paintForm(state.id, state.manual); setView('form'); return; }
}
window.addEventListener('popstate', e => render(e.state));
history.replaceState({v:'list'}, '');

/* ============================================================
   一覧
   ============================================================ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// 全角半角・カタカナ/ひらがな・大小文字・記号のゆれを吸収して検索する
function norm(s){
  return String(s == null ? '' : s)
    .normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60))
    .replace(/[\s　・･\-‐‑–—−ー－_.,、。（）()]/g, '');
}

function allTags(){
  return [...new Set(cards.flatMap(c => c.tags || []).map(t => t.trim()).filter(Boolean))].sort();
}
function sorter_(a, b){
  const t = x => new Date(x.createdAt || 0).getTime();
  if (sortBy === 'old') return t(a) - t(b);
  // ふりがながあれば五十音順になる。無ければ氏名で比較
  if (sortBy === 'name') return norm(a.kana || a.name).localeCompare(norm(b.kana || b.name), 'ja');
  if (sortBy === 'company') return norm(a.company||'～').localeCompare(norm(b.company||'～'), 'ja');
  return t(b) - t(a);
}

// バックアップの督促：未書き出しが10件たまるか、前回から14日経ったら出す
const EXPORT_KEY = 'meishi_last_export';
function updateNudge(){
  const n = $('#nudge');
  if (n.dataset.closed === '1' || !cards.length){ n.hidden = true; return; }
  let last = null;
  try { last = JSON.parse(localStorage.getItem(EXPORT_KEY) || 'null'); } catch(e){}
  const since = last ? cards.filter(c => new Date(c.createdAt||0) > new Date(last.at)).length : cards.length;
  const days = last ? Math.floor((Date.now() - new Date(last.at)) / 86400000) : null;
  let msg = '';
  if (since >= 10) msg = '書き出していない名刺が' + since + '件あります。端末から消えると戻せません。';
  else if (days !== null && days >= 14 && since > 0) msg = '前回の書き出しから' + days + '日経ちました。';
  else if (last === null && cards.length >= 3) msg = 'まだ一度も書き出していません。念のため保存しておきませんか。';
  if (!msg){ n.hidden = true; return; }
  $('#nudge-msg').textContent = msg;
  n.hidden = false;
}

function exhibitions(){
  return [...new Set(cards.map(c => (c.exhibition||'').trim()).filter(Boolean))];
}
function renderChips(){
  const items = [{k:'all',l:'すべて'},{k:'follow',l:'要フォロー'}]
    .concat(exhibitions().map(e => ({k:'ex:'+e, l:e})));
  if (!items.some(i => i.k === filter)) filter = 'all';
  $('#chips').innerHTML = items.map(i =>
    `<button class="chip${i.k===filter?' active':''}" data-k="${esc(i.k)}">${esc(i.l)}</button>`).join('');
}
function matches(c){
  if (filter === 'follow' && !(c.followup && !c.followupDone)) return false;
  if (filter.startsWith('ex:') && (c.exhibition||'') !== filter.slice(3)) return false;
  if (keyword){
    const hay = norm([c.name,c.kana,c.company,c.title,c.exhibition,
                      (c.tags||[]).join(' '),c.memo,c.nextAction,c.url,c.address,c.sns].join(' '));
    // スペース区切りは全部を含むもの（AND）
    const words = keyword.split(/[\s　]+/).map(norm).filter(Boolean);
    if (!words.every(w => hay.includes(w))) return false;
  }
  return true;
}
function renderList(){
  renderChips();
  $('#count').textContent = cards.length + ' 件';
  const view = cards.filter(matches).sort(sorter_);
  $('#hits').textContent = (keyword || filter !== 'all') ? view.length + ' 件を表示' : '';
  $('#tag-list').innerHTML = allTags().map(t => `<option value="${esc(t)}">`).join('');
  updateNudge();
  const el = $('#list');
  if (!cards.length){
    el.innerHTML = `<div class="empty"><span class="empty-icon">📇</span>
      <p>名刺がまだ登録されていません。<br>右下のボタンから撮影してみましょう</p></div>`;
    return;
  }
  if (!view.length){
    el.innerHTML = `<div class="empty"><p>該当する名刺が見つかりません。</p></div>`;
    return;
  }
  el.innerHTML = view.map(c => {
    const needs = c.followup && !c.followupDone;
    const tags = []
      .concat(c.exhibition ? [`<span class="tag exhibition">${esc(c.exhibition)}</span>`] : [])
      .concat((c.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`));
    return `<article class="card-item${needs?' followup':''}" data-id="${c.id}">
      <p class="card-name">${esc(c.name)}</p>
      ${c.title ? `<p class="card-title">${esc(c.title)}</p>` : ''}
      ${c.company ? `<p class="card-company">${esc(c.company)}</p>` : ''}
      ${tags.length ? `<div class="card-tags">${tags.join('')}</div>` : ''}
      ${needs ? `<span class="badge-follow">要対応${c.followupDate ? '　'+esc(c.followupDate) : ''}</span>` : ''}
    </article>`;
  }).join('');
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.k; renderList();
});
$('#sort').addEventListener('change', e => { sortBy = e.target.value; renderList(); });
$('#nudge-close').addEventListener('click', () => { $('#nudge').dataset.closed = '1'; $('#nudge').hidden = true; });
$('#nudge-go').addEventListener('click', () => { openSheet(); $('#btn-export').click(); });
$('#search').addEventListener('input', e => { keyword = e.target.value.trim(); renderList(); });
$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card-item'); if (!c) return;
  go({v:'detail', id:c.dataset.id});
});

/* ============================================================
   フォーム
   ============================================================ */
function resetForm(){
  ['f-name','f-kana','f-title','f-company','f-tel','f-email','f-address','f-url','f-sns','f-exhibition','f-tags','f-memo','f-next','f-followdate']
    .forEach(id => $('#'+id).value = '');
  $('#f-name').classList.remove('invalid');
  $('#name-hint').hidden = true;
  setFollow(false);
  $('#preview').removeAttribute('src');
  $('#preview-area').hidden = true;
  $('#shot-area').hidden = false;
  $('#ocr-bar').hidden = true;
  $('#file').value = '';
  $('#qr-note').hidden = true;
  $('#side-choice').hidden = true;
  $('#sides-note').hidden = true;
  shots = [];
  shotBmps = [];
  qrAll = null;
  $('#attach-photo').hidden = true;
  pendingImage = '';
  skipOcr = false;
}
function setFollow(on){
  const sw = $('#f-follow');
  sw.classList.toggle('on', on);
  sw.setAttribute('aria-checked', on ? 'true' : 'false');
  $('#follow-date-wrap').hidden = !on;
}
$('#f-follow').addEventListener('click', () => setFollow(!$('#f-follow').classList.contains('on')));

let pendingImage = '';   // 保存する圧縮済み dataURL
let skipOcr = false;     // 「写真も残す」から選んだときは文字認識をしない

function paintForm(id, manual){
  editingId = id || null;
  resetForm();
  $('#exh-list').innerHTML = exhibitions().map(e => `<option value="${esc(e)}">`).join('');
  if (id){
    const c = getCard(id);
    if (!c){ render({v:'list'}); return; }
    $('#form-title').textContent = '名刺を編集';
    $('#f-name').value = c.name || ''; $('#f-title').value = c.title || '';
    $('#f-kana').value = c.kana || '';
    $('#f-company').value = c.company || ''; $('#f-tel').value = c.tel || '';
    $('#f-email').value = c.email || ''; $('#f-address').value = c.address || '';
    $('#f-url').value = c.url || '';
    $('#f-sns').value = c.sns || '';
    $('#f-exhibition').value = c.exhibition || ''; $('#f-tags').value = (c.tags||[]).join(', ');
    $('#f-memo').value = c.memo || ''; $('#f-next').value = c.nextAction || '';
    setFollow(!!c.followup); $('#f-followdate').value = c.followupDate || '';
    if (c.image){
      pendingImage = c.image;
      $('#preview').src = c.image;
      $('#preview-area').hidden = false; $('#shot-area').hidden = true;
    }
    $('#fields').hidden = false;
    $('#btn-delete').hidden = false;
  } else {
    $('#form-title').textContent = '名刺を登録';
    $('#fields').hidden = !manual;
    $('#btn-delete').hidden = true;
  }
}
$('#fab').addEventListener('click', () => {
  go({v:'form', id:null});
  $('#file').click();          // 同じタップの流れで開く（間を空けるとiOSに止められる）
});
$('#attach-photo').addEventListener('click', () => { skipOcr = true; $('#file').click(); });
$('#manual-btn').addEventListener('click', () => {
  $('#fields').hidden = false;
  $('#f-name').focus({preventScroll:true});
  $('#f-name').scrollIntoView({behavior:'smooth', block:'center'});
});
$('#form-back').addEventListener('click', () => history.back());
$('#detail-back').addEventListener('click', () => history.back());
$('#shot-box').addEventListener('click', () => $('#file').click());
$('#retake').addEventListener('click', () => {
  shots = []; shotBmps = []; qrAll = null;
  $('#qr-note').hidden = true; $('#side-choice').hidden = true; $('#sides-note').hidden = true;
  $('#file').click();
});

$('#btn-save').addEventListener('click', () => {
  const name = $('#f-name').value.trim();
  if (!name){
    $('#f-name').classList.add('invalid');
    $('#name-hint').hidden = false;
    $('#f-name').focus();
    $('#f-name').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const on = $('#f-follow').classList.contains('on');
  const data = {
    id: editingId, name,
    kana: $('#f-kana').value.trim(),
    title: $('#f-title').value.trim(),
    company: $('#f-company').value.trim(),
    tel: $('#f-tel').value.trim(),
    email: $('#f-email').value.trim(),
    address: $('#f-address').value.trim(),
    url: $('#f-url').value.trim(),
    sns: $('#f-sns').value.trim(),
    exhibition: $('#f-exhibition').value.trim(),
    tags: $('#f-tags').value.split(/[,、]/).map(t => t.trim()).filter(Boolean),
    memo: $('#f-memo').value.trim(),
    nextAction: $('#f-next').value.trim(),
    followup: on,
    followupDate: on ? $('#f-followdate').value : '',
    image: pendingImage || ''
  };
  if (!on) data.followupDone = false;
  // 同じ人が既に登録されていないか（展示会で毎年会う相手など）
  if (!editingId){
    const dup = findDuplicate(data);
    if (dup){
      const when = dup.createdAt ? new Date(dup.createdAt).toLocaleDateString('ja-JP') : '登録日不明';
      const where = dup.exhibition ? '／' + dup.exhibition : '';
      if (!confirm('同じ方が既に登録されています。\n\n'
          + dup.name + (dup.company ? '（' + dup.company + '）' : '') + '\n'
          + when + where + '\n\n'
          + '「キャンセル」を押すと前回の登録を開きます。\n新しく登録しますか？')){
        render({v:'detail', id:dup.id});
        history.replaceState({v:'detail', id:dup.id}, '');
        return;
      }
    }
  }

  const id = saveCard(data);
  renderList();
  history.replaceState({v:'detail', id}, '');
  render({v:'detail', id});
  showToast('保存しました');
});
$('#btn-delete').addEventListener('click', () => {
  if (!editingId) return;
  if (!confirm('この名刺を削除します。よろしいですか？')) return;
  deleteCard(editingId);
  currentId = null; editingId = null;
  history.replaceState({v:'list'}, '');
  render({v:'list'});
});

/* ============================================================
   画像の下ごしらえ ＋ OCR
   ============================================================ */
async function loadBitmap(file){
  if (window.createImageBitmap){
    try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch(e){}
    try { return await createImageBitmap(file); } catch(e){}
  }
  return await new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
// 保存用：長辺1000pxのJPEGに圧縮（localStorageを食い潰さないため）
function toThumb(bmp){
  const s = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * s));
  c.height = Math.max(1, Math.round(bmp.height * s));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.62);
}
/* ============================================================
   QRコードの解読（端末内で処理・API費用はかからない）
   日本の名刺のQRは vCard / MECARD で連絡先そのものが入っていることが多く、
   その場合はOCRより確実なので QR の値を優先する
   ============================================================ */
function readQr(bmp){
  if (typeof jsQR === 'undefined') return null;
  // 小さすぎると読めず、大きすぎると重いので2段階で試す
  for (const target of [1000, 1600]){
    const s = Math.min(1, target / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * s));
    c.height = Math.max(1, Math.round(bmp.height * s));
    const g = c.getContext('2d', {willReadFrequently:true});
    g.drawImage(bmp, 0, 0, c.width, c.height);
    const im = g.getImageData(0, 0, c.width, c.height);
    try {
      const r = jsQR(im.data, im.width, im.height, {inversionAttempts:'attemptBoth'});
      if (r) { const t = decodeQrBytes_(r); if (t) return t; }
    } catch(e){}
  }
  return null;
}

// 日本の名刺QRは Shift_JIS で作られていることが多く、jsQR の .data は空になる。
// バイト列から UTF-8 → Shift_JIS の順で解釈し直す
function decodeQrBytes_(r){
  const bytes = r.binaryData && r.binaryData.length ? Uint8Array.from(r.binaryData) : null;
  if (bytes){
    for (const enc of ['utf-8', 'shift_jis']){
      try {
        const t = new TextDecoder(enc, {fatal:true}).decode(bytes);
        if (t && t.trim()) return t;
      } catch(e){}
    }
  }
  return r.data || '';
}

// QRの中身を項目に変換する。連絡先でなければ url だけ返す
function parseQr(text){
  if (!text) return null;
  const t = text.trim();
  if (/^BEGIN:VCARD/i.test(t)) return parseVcard_(t);
  if (/^MECARD:/i.test(t))     return parseMecard_(t);
  if (/^https?:\/\//i.test(t)){
    // QRがSNSのリンクなら sns 欄に入れる（会社サイトと混ざらないように）
    const m = t.match(/(instagram|twitter|x\.com|facebook|linkedin|threads|tiktok|line\.me|lin\.ee)/i);
    if (m){
      const name = {instagram:'Instagram','twitter':'X','x.com':'X',facebook:'Facebook',
                    linkedin:'LinkedIn',threads:'Threads',tiktok:'TikTok','line.me':'LINE','lin.ee':'LINE'}[m[1].toLowerCase()] || 'SNS';
      return { sns: name + ': ' + t };
    }
    return { url: t };
  }
  if (/^mailto:/i.test(t))     return { email: t.replace(/^mailto:/i, '') };
  if (/^tel:/i.test(t))        return { tel: t.replace(/^tel:/i, '') };
  return null;
}

// QRの住所は「郵便番号」が別項目で入るので、〒として先頭に出す
function joinAddr_(parts){
  const zip = [], rest = [];
  parts.filter(Boolean).map(x => String(x).trim()).filter(Boolean).forEach(x => {
    if (/^\d{3}-?\d{4}$/.test(x)) zip.push(x.length === 7 ? x.slice(0,3) + '-' + x.slice(3) : x);
    else rest.push(x);
  });
  const body = rest.join('');
  return zip.length ? '〒' + zip[0] + ' ' + body : body;
}

function parseVcard_(t){
  const out = {};
  t.split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':'); if (i < 0) return;
    const rawKey = line.slice(0, i);
    const val = line.slice(i + 1).replace(/\\,/g, ',').replace(/\;/g, ';').trim();
    const key = rawKey.split(';')[0].toUpperCase();
    const params = rawKey.toUpperCase();
    if (!val) return;
    if (key === 'FN') out.name = val;
    else if (key === 'N' && !out.name) out.name = val.split(';').slice(0,2).filter(Boolean).join(' ');
    else if (key === 'ORG') out.company = val.split(';')[0];
    else if (key === 'TITLE') out.title = val;
    else if (key === 'EMAIL') out.email = out.email || val;
    else if (key === 'URL') out.url = out.url || val;
    else if (key === 'ADR') out.address = joinAddr_(val.split(';').reverse());
    else if (key === 'TEL'){
      if (/CELL|MOBILE/.test(params)) out.mobile = out.mobile || val;
      else if (/FAX/.test(params))    out.fax = out.fax || val;
      else                            out.tel = out.tel || val;
    }
  });
  return out;
}

function parseMecard_(t){
  const out = {};
  t.replace(/^MECARD:/i, '').split(';').forEach(part => {
    const i = part.indexOf(':'); if (i < 0) return;
    const key = part.slice(0, i).toUpperCase();
    const val = part.slice(i + 1).trim();
    if (!val) return;
    if (key === 'N')       out.name = val.split(',').filter(Boolean).join(' ');
    else if (key === 'ORG')  out.company = val;
    else if (key === 'TEL')  out.tel = out.tel || val;
    else if (key === 'TELAV' || key === 'TELCELL') out.mobile = out.mobile || val;
    else if (key === 'FAX')  out.fax = val;
    else if (key === 'EMAIL')out.email = out.email || val;
    else if (key === 'URL')  out.url = out.url || val;
    else if (key === 'ADR')  out.address = joinAddr_(val.split(','));
    else if (key === 'SOUND')out.kana = val.split(',').filter(Boolean).join(' ');
  });
  return out;
}

// 読み取りに送る画像（長辺1400pxのJPEG）
function toUpload(bmp){
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * s));
  c.height = Math.max(1, Math.round(bmp.height * s));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72).split(',')[1];
}

// ためた画像をまとめてGAS経由でClaudeに送る
async function runExtraction(retried){
  if (!shots.length) return;
  const bar = $('#ocr-bar');
  const passcode = getPasscode();
  if (!passcode){
    bar.hidden = false; bar.classList.add('error');
    $('#ocr-spin').hidden = true;
    $('#ocr-msg').textContent = '合言葉が未入力です。手入力で登録してください。';
    $('#fields').hidden = false;
    return;
  }

  bar.hidden = false; bar.classList.remove('error');
  $('#ocr-spin').hidden = false;
  $('#ocr-msg').textContent = shots.length > 1 ? '両面を読み取っています…' : '名刺を読み取っています…';
  $('#ocr-pct').textContent = '';

  try {
    // text/plain で送ると事前確認(preflight)が起きずGASに直接届く
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ passcode, images: shots })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '読み取りに失敗しました');
    fillFields(Object.assign({}, data.fields, qrAll || {}));   // QRの項目で上書き＝QR優先
    const f0 = data.fields || {};
    lastFix = '';
    applyWarp(shotBmps[0], f0.corners) || applyCrop(shotBmps[0], f0.crop);
    $('#ocr-spin').hidden = true;
    $('#ocr-msg').textContent = '読み取りました。内容を確認してください。'
      + (lastFix ? '［' + lastFix + '］' : '［補正なし］');
  } catch(err){
    const msg = String(err.message || err);
    // 合言葉違いは覚え直せば直る。記憶を消してその場で聞き、1回だけやり直す
    if (msg.indexOf('合言葉') >= 0 && !retried){
      forgetPasscode();
      $('#ocr-msg').textContent = '合言葉が違いました。入力し直してください。';
      if (getPasscode()){ return runExtraction(true); }
    }
    if (qrAll) fillFields(qrAll);                              // 読み取り失敗でもQR分は入れる
    bar.classList.add('error');
    $('#ocr-spin').hidden = true;
    $('#ocr-msg').textContent = msg
      + (qrAll ? '（QRの分だけ入力しました）' : '（手入力で登録できます）');
  }
  $('#fields').hidden = false;
}

/* ============================================================
   台形補正（傾いた名刺をまっすぐな長方形に直す）
   四隅は読み取りと同じリクエストでAIが返す。処理は端末内なので費用ゼロ
   ============================================================ */
// 出力の四隅 → 元画像の四隅 への射影変換を解く（8元1次連立方程式）
function solveHomography_(dst, src){
  const A = [], b = [];
  for (let i = 0; i < 4; i++){
    const {x:u, y:v} = dst[i], {x, y} = src[i];
    A.push([u, v, 1, 0, 0, 0, -u*x, -v*x]); b.push(x);
    A.push([0, 0, 0, u, v, 1, -u*y, -v*y]); b.push(y);
  }
  for (let c = 0; c < 8; c++){                       // ガウスの消去法
    let piv = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-9) return null;     // 解けない＝四隅が潰れている
    [A[c], A[piv]] = [A[piv], A[c]]; [b[c], b[piv]] = [b[piv], b[c]];
    for (let r = 0; r < 8; r++){
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  return b.map((v, i) => v / A[i][i]);
}

// 画素を書き換える本体。DOMに依存しないので単体で検証できる
function warpPixels_(src, sw, sh, pts, W, H){
  const h = solveHomography_(
    [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}], pts);
  if (!h) return null;
  const out = new Uint8ClampedArray(W * H * 4);
  for (let v = 0; v < H; v++){
    for (let u = 0; u < W; u++){
      const d = h[6]*u + h[7]*v + 1;
      const x = (h[0]*u + h[1]*v + h[2]) / d;
      const y = (h[3]*u + h[4]*v + h[5]) / d;
      const o = (v * W + u) * 4;
      if (x < 0 || y < 0 || x > sw - 1 || y > sh - 1){ out[o]=out[o+1]=out[o+2]=255; out[o+3]=255; continue; }
      const x0 = x | 0, y0 = y | 0;
      const x1 = Math.min(x0 + 1, sw - 1), y1 = Math.min(y0 + 1, sh - 1);
      const fx = x - x0, fy = y - y0;
      for (let ch = 0; ch < 3; ch++){                // 双一次補間でなめらかに
        const p00 = src[(y0*sw + x0)*4 + ch], p10 = src[(y0*sw + x1)*4 + ch];
        const p01 = src[(y1*sw + x0)*4 + ch], p11 = src[(y1*sw + x1)*4 + ch];
        out[o + ch] = (p00*(1-fx) + p10*fx)*(1-fy) + (p01*(1-fx) + p11*fx)*fy;
      }
      out[o + 3] = 255;
    }
  }
  return out;
}

// 四隅をもらって保存画像を作り直す
function applyWarp(bmp, corners){
  if (!bmp || !corners) return false;
  const keys = ['tl','tr','br','bl'];
  if (!keys.every(k => corners[k] && isFinite(corners[k].x) && isFinite(corners[k].y))){ lastFix = '四隅なし'; return false; }

  const work = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const sw = Math.round(bmp.width * work), sh = Math.round(bmp.height * work);
  const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  const sg = sc.getContext('2d', {willReadFrequently:true});
  sg.drawImage(bmp, 0, 0, sw, sh);
  const src = sg.getImageData(0, 0, sw, sh).data;

  let pts = keys.map(k => ({ x: corners[k].x / 100 * sw, y: corners[k].y / 100 * sh }));
  const cx = pts.reduce((a,p) => a + p.x, 0) / 4, cy = pts.reduce((a,p) => a + p.y, 0) / 4;
  pts = pts.map(p => ({ x: cx + (p.x - cx) * 1.02, y: cy + (p.y - cy) * 1.02 }));  // 端を切らないよう2%外へ

  const dist = (a,b) => Math.hypot(a.x - b.x, a.y - b.y);
  let W = (dist(pts[0],pts[1]) + dist(pts[3],pts[2])) / 2;
  let H = (dist(pts[0],pts[3]) + dist(pts[1],pts[2])) / 2;
  if (!(W > 40 && H > 30)){ lastFix = '四隅が小さすぎ'; return false; }   // 誤検出
  const ar = W / H;
  if (ar < 0.3 || ar > 3.5){ lastFix = '形が不自然(比' + ar.toFixed(2) + ')'; return false; }
  const s = Math.min(1, 1000 / Math.max(W, H));
  W = Math.max(1, Math.round(W * s)); H = Math.max(1, Math.round(H * s));

  // 四隅が「軸に平行な長方形」に丸められていないか（＝AIが枠しか見ていない兆候）
  const ang = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) * 180 / Math.PI;
  const out = warpPixels_(src, sw, sh, pts, W, H);
  if (!out){ lastFix = '台形補正できず'; return false; }
  lastFix = '台形補正 傾き' + ang.toFixed(1) + '°';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').putImageData(new ImageData(out, W, H), 0, 0);
  pendingImage = c.toDataURL('image/jpeg', 0.68);
  $('#preview').src = pendingImage;
  return true;
}

// AIが返した「名刺の範囲」で切り抜いて保存画像を作り直す。
// 切り落とすと台無しなので、返ってきた枠より4%だけ外側を取る（実測のズレは最大3.8%）
const CROP_MARGIN = 4;
let lastFix = '';        // 直近の補正結果（原因調査用に表示する）
function applyCrop(bmp, crop){
  if (!bmp || !crop) return false;
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  let l = num(crop.left), t = num(crop.top), r = num(crop.right), b = num(crop.bottom);
  if (l === null || t === null || r === null || b === null) return false;
  l -= CROP_MARGIN; t -= CROP_MARGIN; r += CROP_MARGIN; b += CROP_MARGIN;
  l = Math.max(0, l); t = Math.max(0, t); r = Math.min(100, r); b = Math.min(100, b);
  const w = r - l, h = b - t;
  if (w < 15 || h < 10) return false;                 // 小さすぎる＝誤検出とみなす
  if (w > 99 && h > 99) return false;                 // 画像いっぱい＝切る意味がない
  const px = Math.round(bmp.width  * l / 100), py = Math.round(bmp.height * t / 100);
  const pw = Math.round(bmp.width  * w / 100), ph = Math.round(bmp.height * h / 100);
  const scale = Math.min(1, 1000 / Math.max(pw, ph));
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(pw * scale));
  c.height = Math.max(1, Math.round(ph * scale));
  c.getContext('2d').drawImage(bmp, px, py, pw, ph, 0, 0, c.width, c.height);
  pendingImage = c.toDataURL('image/jpeg', 0.62);
  $('#preview').src = pendingImage;
  lastFix = (lastFix ? lastFix + ' → ' : '') + '枠で切り抜き';
  return true;
}

// APIが返した項目をフォームに入れる
function fillFields(f){
  if (!f) return;
  const put = (id, v) => { if (v && !$('#'+id).value) $('#'+id).value = String(v).trim(); };
  put('f-name', f.name);
  put('f-kana', f.kana);
  put('f-title', [f.department, f.title].filter(Boolean).join(' '));
  put('f-company', f.company);
  put('f-tel', f.tel || f.mobile);
  put('f-email', f.email);
  put('f-address', f.address);
  put('f-url', f.url);
  put('f-sns', f.sns);
  const extra = [];
  if (f.fax) extra.push('FAX ' + f.fax);
  if (f.mobile && f.tel) extra.push('携帯 ' + f.mobile);
  if (extra.length && !$('#f-memo').value) $('#f-memo').value = extra.join('\n');
}

// SNS欄は1行ずつ。URLやIDからサービスを推測してリンクにする（分からなければ文字のまま）
const SNS_BASE = [
  [/insta/i,             'https://www.instagram.com/'],
  [/(^|[^a-z])(x|twitter)([^a-z]|$)/i, 'https://x.com/'],
  [/facebook|(^|[^a-z])fb([^a-z]|$)/i, 'https://www.facebook.com/'],
  [/linkedin/i,          'https://www.linkedin.com/in/'],
  [/threads/i,           'https://www.threads.net/@'],
  [/tiktok/i,            'https://www.tiktok.com/@']
];
function snsHtml_(text){
  return String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const u = line.match(/https?:\/\/\S+/);
    if (u) return `<a href="${esc(u[0])}" target="_blank" rel="noopener">${esc(line)}</a>`;
    const h = line.match(/@?([A-Za-z0-9._-]{2,})\s*$/);
    if (h){
      for (const [re, base] of SNS_BASE){
        if (re.test(line)) return `<a href="${esc(base + h[1])}" target="_blank" rel="noopener">${esc(line)}</a>`;
      }
    }
    // サービスが分からないIDは、推測でリンクにせず開き先を選ばせる
    const bare = line.match(/^(?:SNS)?\s*[:：]?\s*@?([A-Za-z0-9._-]{2,})$/i);
    if (bare && !/LINE/i.test(line)){
      const id = bare[1];
      return esc(line) + ' <span class="sns-pick">'
        + `<a href="https://www.instagram.com/${esc(id)}" target="_blank" rel="noopener">Instagram</a>`
        + `<a href="https://x.com/${esc(id)}" target="_blank" rel="noopener">X</a>`
        + '</span>';
    }
    return esc(line);            // LINE IDなど、リンクにできないものは文字のまま
  }).join('<br>');
}

  if (c.sns) rows.push(row(ICON.sns,'SNS', snsHtml_(c.sns), 'addr'));
  if (c.exhibition) rows.push(row(ICON.exhibition,'展示会',`<div class="detail-tags"><span class="tag exhibition">${esc(c.exhibition)}</span></div>`));
  if (c.tags && c.tags.length) rows.push(row(ICON.tags,'タグ',`<div class="detail-tags">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`));
  $('#d-rows').innerHTML = rows.join('');

  if (c.followup){
    const done = !!c.followupDone;
    $('#d-follow').innerHTML = `<div class="fu-block${done?' done':''}">
      <p class="st">${done ? '✓ 対応済み' : '要対応'}</p>
      ${c.followupDate ? `<p class="dt">期限 ${esc(c.followupDate)}</p>` : ''}</div>`;
    $('#btn-done').hidden = done;
  } else {
    $('#d-follow').innerHTML = '';
    $('#btn-done').hidden = true;
  }
  $('#btn-mail').hidden = !c.email;
  if (c.image){ $('#d-photo').src = c.image; $('#d-photo').hidden = false; }
  else { $('#d-photo').removeAttribute('src'); $('#d-photo').hidden = true; }

  let m = '';
  if (c.memo) m += `<div class="block"><h3>商談メモ</h3><p>${esc(c.memo)}</p></div>`;
  if (c.nextAction) m += `<div class="block"><h3>次回アクション</h3><p>${esc(c.nextAction)}</p></div>`;
  $('#d-memo').innerHTML = m;
}
// 会社の文体（お世話になります → 用件 → どうぞよろしくお願いいたします）で下書きを作る
function mailDraft(c){
  const jp = /[぀-ヿ一-鿿]/.test((c.name||'') + (c.company||''));
  const place = c.exhibition ? c.exhibition + 'にて' : '';
  if (jp){
    const to = [c.company, (c.name || '') + ' 様'].filter(Boolean).join('\n');
    return {
      subject: '先日はありがとうございました（大川原染色本舗）',
      body: to + '\n\n' +
        '　お世話になります。\n' +
        '先日は' + place + 'お時間をいただき、ありがとうございました。\n\n' +
        '\n\n' +
        'どうぞよろしくお願いいたします。\n\n' +
        '大川原染色本舗\n大川原\n'
    };
  }
  return {
    subject: 'Thank you for your time - Okawahara Senshoku',
    body: 'Dear ' + (c.name || '') + ',\n\n' +
      'Thank you for taking the time to speak with us' +
      (c.exhibition ? ' at ' + c.exhibition : '') + '.\n\n' +
      '\n\n' +
      'Best regards,\n\nOkawahara Senshoku Honpo\n'
  };
}
$('#btn-mail').addEventListener('click', () => {
  const c = getCard(currentId); if (!c || !c.email) return;
  const d = mailDraft(c);
  location.href = 'mailto:' + encodeURIComponent(c.email)
    + '?subject=' + encodeURIComponent(d.subject)
    + '&body=' + encodeURIComponent(d.body);
});
$('#d-photo').addEventListener('click', () => {
  const src = $('#d-photo').getAttribute('src'); if (!src) return;
  $('#zoom-img').src = src; $('#photo-zoom').hidden = false;
});
$('#photo-zoom').addEventListener('click', () => { $('#photo-zoom').hidden = true; });
$('#btn-edit').addEventListener('click', () => go({v:'form', id:currentId}));
$('#btn-done').addEventListener('click', () => {
  const c = getCard(currentId); if (!c) return;
  c.followupDone = true; persistSafe();
  renderList(); paintDetail(currentId);
});

let toastTimer = null;
let toastAction = null;
function showToast(msg, label, fn, keep){
  $('#toast-msg').textContent = msg;
  $('#toast-act').textContent = label || '＋ 次を撮る';
  toastAction = fn || (() => { go({v:'form', id:null}); $('#file').click(); });
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  if (!keep) toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 6000);
}
$('#toast-act').addEventListener('click', () => {
  $('#toast').hidden = true;
  if (toastAction) toastAction();
});

/* ============================================================
   更新の確認（アプリを消して入れ直す必要をなくす）
   ============================================================ */
const APP_VERSION = '20260829-5';
async function checkUpdate(silent){
  try {
    const res = await fetch('index.html?_=' + Date.now(), {cache:'no-store'});
    const t = await res.text();
    const m = t.match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION){
      showToast('新しい版があります（' + m[1] + '）', '更新する',
        () => location.replace(location.pathname + '?v=' + m[1]), true);
      return true;
    }
    if (!silent) alert('最新版です（' + APP_VERSION + '）');
    return false;
  } catch(e){
    if (!silent) alert('更新を確認できませんでした。電波の状況をご確認ください。');
    return false;
  }
}
setTimeout(() => checkUpdate(true), 1500);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkUpdate(true);      // 画面に戻ったときも確認する
});

/* ============================================================
   バックアップ（書き出し／読み込み）
   ============================================================ */
const sheet = $('#sheet-bg');
function openSheet(){
  $('#sheet-count').textContent = cards.length;
  $('#sheet-ver').textContent = APP_VERSION;
  $('#sheet-size').textContent = Math.round(new Blob([JSON.stringify(cards)]).size / 1024);
  sheet.hidden = false;
}
$('#btn-sheet').addEventListener('click', openSheet);
$('#sheet-close').addEventListener('click', () => sheet.hidden = true);
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });

$('#btn-export').addEventListener('click', () => {
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const payload = { app:'meishi', version:1, exportedAt:d.toISOString(), count:cards.length, cards };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '名刺バックアップ_' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  try { localStorage.setItem(EXPORT_KEY, JSON.stringify({at: new Date().toISOString(), count: cards.length})); } catch(e){}
  $('#nudge').hidden = true;
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#btn-import').addEventListener('click', () => $('#import-file').click());
$('#btn-update').addEventListener('click', async () => {
  sheet.hidden = true;
  await checkUpdate(false);
});
$('#btn-passcode').addEventListener('click', () => {
  forgetPasscode();
  const p = getPasscode();                     // 入力を促す
  alert(p ? '合言葉を保存しました。もう一度撮影してみてください。' : '合言葉を消しました。次の撮影時に聞かれます。');
  sheet.hidden = true;
});
$('#import-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let incoming;
    try {
      const parsed = JSON.parse(r.result);
      incoming = Array.isArray(parsed) ? parsed : parsed.cards;
      if (!Array.isArray(incoming)) throw new Error('形式が違う');
    } catch(err){
      alert('このファイルは読み込めませんでした。書き出したJSONファイルを選んでください。');
      e.target.value = ''; return;
    }
    let add = 0, upd = 0;
    incoming.forEach(c => {
      if (!c || !c.name) return;
      const i = cards.findIndex(x => x.id === c.id);
      if (i >= 0){ cards[i] = Object.assign({}, cards[i], c); upd++; }
      else { if (!c.id) c.id = 'c' + Date.now() + Math.random().toString(36).slice(2,6); cards.unshift(c); add++; }
    });
    if (!add && !upd){ alert('読み込める名刺がありませんでした。'); e.target.value = ''; return; }
    persistSafe();
    renderList(); openSheet();
    alert('読み込みました。\n新規 ' + add + ' 件 ／ 上書き ' + upd + ' 件');
    e.target.value = '';
  };
  r.readAsText(f);
});

renderList();
</script>
